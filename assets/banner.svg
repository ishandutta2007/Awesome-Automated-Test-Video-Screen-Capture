<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="recGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Subtle Non-Intrusive Dynamic / Animated Elements in Background */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.55; }
    }
    @keyframes pulseRec {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.92); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0; }
    }
    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 300px;
    }
    .rec-dot {
      animation: pulseRec 1.8s ease-in-out infinite;
      transform-origin: 875px 85px;
    }
    .scan-active {
      animation: scanLine 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .animated-wave {
      stroke-dasharray: 8 6;
      animation: waveMove 20s linear infinite;
    }
    .pill-float-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPill 6s ease-in-out infinite 1s;
    }
    .pill-float-3 {
      animation: floatPill 5.5s ease-in-out infinite 2s;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />

  <!-- Animated Glowing Atmospheric Orbs (Always in deep background) -->
  <g class="orb-1">
    <circle cx="220" cy="120" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle cx="150" cy="240" r="120" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="280" r="180" fill="#c084fc" opacity="0.12" filter="url(#glow)" />
    <circle cx="880" cy="150" r="140" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Ambient Wave Path in Background -->
  <path class="animated-wave" d="M -50 320 Q 300 260 600 330 T 1250 290" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />
  <path class="animated-wave" d="M -50 340 Q 350 280 650 350 T 1250 310" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.2" />

  <!-- Right Visual Element: Modern Screen Capture & Recording Monitor Mockup (Behind text layer) -->
  <g transform="translate(810, 60)">
    <!-- Monitor Outer Frame with Soft Glow -->
    <rect x="0" y="0" width="330" height="230" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#subtleGlow)" />
    <rect x="0" y="0" width="330" height="230" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />

    <!-- Monitor Top Bar -->
    <rect x="0" y="0" width="330" height="34" rx="14" fill="#0f172a" fill-opacity="0.9" />
    <!-- Window Control Dots -->
    <circle cx="20" cy="17" r="4.5" fill="#f43f5e" opacity="0.8" />
    <circle cx="34" cy="17" r="4.5" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="17" r="4.5" fill="#22c55e" opacity="0.8" />

    <!-- Recording Indicator Badge -->
    <g transform="translate(230, 9)">
      <rect x="0" y="0" width="78" height="18" rx="9" fill="#1e293b" stroke="#ef4444" stroke-width="0.8" />
      <circle class="rec-dot" cx="12" cy="9" r="4" fill="#ef4444" />
      <text x="24" y="13" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171" letter-spacing="0.5">REC • LIVE</text>
    </g>

    <!-- Monitor Viewport Content -->
    <rect x="14" y="44" width="302" height="172" rx="8" fill="#090d16" />

    <!-- Test Automation / Code Blocks Wireframe inside Viewport -->
    <rect x="28" y="58" width="130" height="8" rx="4" fill="#38bdf8" opacity="0.4" />
    <rect x="28" y="74" width="90" height="6" rx="3" fill="#64748b" opacity="0.3" />
    <rect x="28" y="86" width="160" height="6" rx="3" fill="#64748b" opacity="0.25" />

    <!-- Test Assertion Badges -->
    <g transform="translate(28, 104)">
      <rect x="0" y="0" width="68" height="16" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.75" />
      <text x="8" y="11" font-family="monospace" font-size="9" fill="#34d399" font-weight="600">✓ PASSED</text>
    </g>
    <g transform="translate(104, 104)">
      <rect x="0" y="0" width="78" height="16" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.75" />
      <text x="8" y="11" font-family="monospace" font-size="9" fill="#a5b4fc" font-weight="600">60 FPS 1080p</text>
    </g>

    <!-- Video Audio Waveform Visualization -->
    <g transform="translate(28, 134)">
      <rect x="0" y="22" width="4" height="14" rx="2" fill="#818cf8" opacity="0.7" />
      <rect x="8" y="14" width="4" height="22" rx="2" fill="#38bdf8" />
      <rect x="16" y="8" width="4" height="28" rx="2" fill="#38bdf8" />
      <rect x="24" y="18" width="4" height="18" rx="2" fill="#818cf8" opacity="0.8" />
      <rect x="32" y="4" width="4" height="32" rx="2" fill="#38bdf8" />
      <rect x="40" y="12" width="4" height="24" rx="2" fill="#818cf8" />
      <rect x="48" y="20" width="4" height="16" rx="2" fill="#64748b" opacity="0.6" />
      <rect x="56" y="10" width="4" height="26" rx="2" fill="#38bdf8" />
      <rect x="64" y="16" width="4" height="20" rx="2" fill="#818cf8" opacity="0.8" />
      <rect x="72" y="6" width="4" height="30" rx="2" fill="#38bdf8" />
      <rect x="80" y="18" width="4" height="18" rx="2" fill="#818cf8" />
      <rect x="88" y="22" width="4" height="14" rx="2" fill="#64748b" opacity="0.6" />
      <rect x="96" y="12" width="4" height="24" rx="2" fill="#38bdf8" />
      <rect x="104" y="16" width="4" height="20" rx="2" fill="#818cf8" />
      <rect x="112" y="22" width="4" height="14" rx="2" fill="#64748b" opacity="0.5" />
    </g>

    <!-- Dynamic Scanning Line Overlay -->
    <g class="scan-active">
      <line x1="14" y1="0" x2="316" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" filter="url(#glow)" />
    </g>
  </g>

  <!-- FOREGROUND TEXT AND HEADINGS (Crystal Clear Foreground Hierarchy) -->
  <g transform="translate(80, 80)">
    <!-- Category Pill Tag -->
    <g>
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
      <circle cx="16" cy="14" r="4.5" fill="#38bdf8" />
      <text x="28" y="18" class="tagline">TEST AUTOMATION &amp; VIDEO CAPTURE</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="78" class="title">
      Awesome Automated Test
    </text>
    <text x="0" y="128" class="title" fill="url(#primaryGrad)">
      Video &amp; Screen Capture
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="168" class="subtitle">
      A curated index of screen recording engines, test video runners,
    </text>
    <text x="0" y="193" class="subtitle">
      asynchronous communication suites &amp; open-source capture tools.
    </text>

    <!-- Floating Feature Pills -->
    <g transform="translate(0, 222)">
      <g class="pill-float-1">
        <rect x="0" y="0" width="168" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
        <text x="24" y="21" class="badge-text" fill="#38bdf8">⚡ Open-Source Tools</text>
      </g>
      <g transform="translate(180, 0)" class="pill-float-2">
        <rect x="0" y="0" width="176" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
        <text x="24" y="21" class="badge-text" fill="#818cf8">📊 SaaS Pricing &amp; Tiers</text>
      </g>
      <g transform="translate(368, 0)" class="pill-float-3">
        <rect x="0" y="0" width="168" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
        <text x="24" y="21" class="badge-text" fill="#c084fc">🎥 Automated Replays</text>
      </g>
    </g>
  </g>
</svg>
